name: iso

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 1 * *'          # dia 1 de cada mês, 07:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependências
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed archiso git github-cli

      - uses: actions/checkout@v4

      - name: Confiar na chave do repo pessoal
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --add repo/joelson-repo.gpg
          pacman-key --lsign-key "$(cat repo/KEYID)"

      - name: Build da ISO
        run: bash iso/build.sh

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd out
          ISO=$(ls *.iso)
          sha256sum "$ISO" > "$ISO.sha256"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "ISO mais recente" \
            --notes "Build automático $(date -u +%F). Pacotes vêm do repo Pages no momento do boot." \
            "$ISO" "$ISO.sha256"
