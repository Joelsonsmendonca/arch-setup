name: iso

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 1 * *'          # dia 1 de cada mês, 07:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependências
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed archiso git github-cli

      - uses: actions/checkout@v4

      - name: Validar scripts e config
        run: |
          pacman -S --noconfirm --needed shellcheck python
          bash -n iso/build.sh iso/airootfs/root/install.sh postinstall.sh
          shellcheck -S warning iso/build.sh postinstall.sh iso/airootfs/root/install.sh || true
          python -c "import json,sys; json.load(open('iso/airootfs/root/joelson.json')); print('joelson.json OK')"

      - name: Confiar na chave do repo pessoal
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --add repo/joelson-repo.gpg
          pacman-key --lsign-key "$(cat repo/KEYID)"

      - name: Build da ISO
        run: bash iso/build.sh

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          git config --global --add safe.directory '*'
          cd out
          ISO=$(ls *.iso)
          sha256sum "$ISO" > "$ISO.sha256"

          gh release delete latest --yes || true
          gh release create latest --title "ISO mais recente" \
            --notes "Build automático $(date -u +%F). Pacotes vêm do repo Pages no momento do boot."

          for i in 1 2 3 4 5; do
            if gh release upload latest "$ISO" "$ISO.sha256" --clobber; then
              exit 0
            fi
            echo "upload falhou, tentativa $i..."; sleep 20
          done
          exit 1
